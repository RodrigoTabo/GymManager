events { }
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Esto es clave para que el navegador entienda Blazor
    types {
        application/wasm wasm;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}